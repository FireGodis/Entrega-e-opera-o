apiVersion: apps/v1
kind: Deployment
metadata:
  name: tarefas-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tarefas-api
  template:
    metadata:
      labels:
        app: tarefas-api
    spec:
      containers:
        - name: api
          image: ghcr.io/firegodis/tarefas-api:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tarefas-api
spec:
  selector:
    app: tarefas-api
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
