name: dotnet-ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore CI-CD/Demo/Demo.csproj
      - run: dotnet build CI-CD/Demo/Demo.csproj --no-restore --configuration Release
